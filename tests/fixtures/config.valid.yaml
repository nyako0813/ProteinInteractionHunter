project:
  name: ProteinInteractionHunter
  run_name: synthetic_fixture
  random_seed: 0
  local_only: true
input:
  proteome_fasta: synthetic_proteome.fasta
  genome_gff: synthetic_genome.gff3
  annotation_table: synthetic_annotations.tsv
  reference_proteomes: []
query:
  protein_ids: [QUERY_001]
  allow_multiple: true
candidate_generation:
  include_hypothetical_proteins: true
  include_missing_coordinates: true
  minimum_length_aa: 20
  duplicate_sequence_policy: flag
  fragment_policy: flag
  self_candidate_policy: exclude
gene_context:
  enabled: true
  neighborhood_gene_count: 5
  operon_proxy_max_intergenic_bp: 200
  require_query_coordinates: false
orthology:
  enabled: true
  source: local_table
  engine: blast
  database:
  local_table: synthetic_orthology.tsv
phylogenetic_profile:
  enabled: true
  source: local_table
  local_table: synthetic_phylogenetic_profiles.tsv
  minimum_shared_species: 2
  minimum_informative_species: 3
  minimum_profile_similarity: 0.8
domains:
  enabled: true
  source: local_table
  local_table: synthetic_domains.tsv
  rules_path: rules/domain_pairs.v1.yaml
functional_complementarity:
  enabled: true
  rules_path: rules/functional_complementarity.v1.yaml
localization:
  enabled: false
  source: annotation_only
known_interactions:
  enabled: false
  local_table: null
  external_services: []
scoring:
  enabled: false
  deterministic_tie_breaker:
    - total_ranking_score
    - evidence_completeness
    - candidate_id
evidence_tiers:
  enabled: false
structure_prediction_queue:
  enabled: true
  maximum_entries: 20
  write_pair_fasta: true
  automatic_structure_prediction: false
output:
  directory: output
  write_jsonl: true
  write_tsv: true
  write_excel: true
  write_config_snapshot: true
cache:
  enabled: true
  directory: .cache
logging:
  level: INFO
  directory: logs
performance:
  workers: 1
