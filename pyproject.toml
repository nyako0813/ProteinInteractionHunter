[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "protein-interaction-hunter"
version = "0.1.0"
description = "Local-first research support schemas for prioritizing protein interaction candidates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved pending an explicit license decision." }
authors = [{ name = "nyako" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "typer>=0.12,<1",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-openpyxl>=3.1,<4",
    "types-PyYAML>=6,<7",
]

[project.scripts]
protein-interaction-hunter = "protein_interaction_hunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_interaction_hunter"]

[tool.pytest.ini_options]
# WSL on a Windows-mounted repository can remove pytest's temporary capture file
# before cleanup. CLI output is still captured explicitly by Typer's CliRunner.
addopts = "-ra -s"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["protein_interaction_hunter"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["protein_interaction_hunter"]
mypy_path = "src"
